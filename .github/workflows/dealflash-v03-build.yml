name: Build DealFlash v0.3 APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore source
        shell: bash
        run: |
          cat tmp-dealflash-v03/chunk-*.txt | tr -d '\n\r' | base64 -d > dealflash-v03.zip
          unzip -q dealflash-v03.zip
      - name: Build debug APK
        working-directory: DealFlashAndroid
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DealFlash-v0.3-debug-apk
          path: DealFlashAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
