name: DealFlash v2.8.1 APK

on:
  push:
    branches: [dealflash-v28-dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct v2.3 base
        shell: bash
        run: |
          set -euo pipefail
          cat \
            dealflash-v23-src/chunk_00.b64 \
            dealflash-v23-src/chunk_01.b64 \
            dealflash-v23-src/chunk_02a.b64 \
            dealflash-v23-src/chunk_02b.b64 \
            dealflash-v23-src/chunk_03a.b64 \
            dealflash-v23-src/chunk_03b.b64 \
            dealflash-v23-src/chunk_04.b64 \
            > /tmp/dealflash-v23.b64
          base64 -d /tmp/dealflash-v23.b64 > /tmp/dealflash-v23.tar.gz
          echo "80c97ecbaf92ac2c280ab01d835d7b5965da6354ec10b0aefa9e654cc5b9b7c1  /tmp/dealflash-v23.tar.gz" | sha256sum -c -
          rm -rf dealflash_build_min
          tar -xzf /tmp/dealflash-v23.tar.gz
          test -f dealflash_build_min/app/build.gradle

      - name: Apply v2.5-v2.7 patches
        shell: bash
        run: |
          set -euo pipefail
          cat dealflash-v25-patch/p{00,01,02,03,04,05,06,07,08}.b64 > /tmp/v25.patch.gz.b64
          base64 -d /tmp/v25.patch.gz.b64 > /tmp/v25.patch.gz
          echo "15096b63f75f4011730d6e842b6de912d055e468e64bc8ad69a5322613dd94bc  /tmp/v25.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v25.patch.gz > /tmp/v25.patch
          sed '/^Binary files .*signing\/preview.keystore.* differ$/d' /tmp/v25.patch > /tmp/v25.clean.patch
          cd dealflash_build_min
          patch -p3 --batch < /tmp/v25.clean.patch || true
          mkdir -p signing
          base64 -d ../dealflash-v25-patch/preview.keystore.b64 > signing/preview.keystore
          echo "49bbffba966efe1ea3a81e336eceb66082bef22ce4a874deacbfdc94b08130d7  signing/preview.keystore" | sha256sum -c -
          python3 ../dealflash-v251-overlay/apply.py
          cat ../dealflash-v253-patch/p00.b64 > /tmp/v253.patch.gz.b64
          base64 -d /tmp/v253.patch.gz.b64 > /tmp/v253.patch.gz
          echo "4fe55ad180970118d5f0bca589965525a322b9f1bf95ce962d56dfee38f274b9  /tmp/v253.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v253.patch.gz > /tmp/v253.patch
          patch -p1 --batch < /tmp/v253.patch
          cat ../dealflash-v26-patch/p{00,01,02,03,04,05,06}.b64 > /tmp/v26.patch.gz.b64
          base64 -d /tmp/v26.patch.gz.b64 > /tmp/v26.patch.gz
          echo "c304fad3ca51e8fc312ea7d18554f6af3d5ee9dd53e949bbb92804e3abf9251d  /tmp/v26.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v26.patch.gz > /tmp/v26.patch
          patch -p1 --batch < /tmp/v26.patch
          cat ../dealflash-v261-patch/p00.b64 > /tmp/v261.patch.gz.b64
          base64 -d /tmp/v261.patch.gz.b64 > /tmp/v261.patch.gz
          echo "e48bbf6186c47599c64016c02e304ef8feea43b334db1c022c589e634511f767  /tmp/v261.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v261.patch.gz > /tmp/v261.patch
          patch -p1 --batch < /tmp/v261.patch
          cat ../dealflash-v27-patch/p{00,01,02,03,04}.b64 > /tmp/v27.patch.gz.b64
          base64 -d /tmp/v27.patch.gz.b64 > /tmp/v27.patch.gz
          echo "5544768be36f23c23b62c101abdea746c897d58c2037aa3acf5b353f26d72413  /tmp/v27.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v27.patch.gz > /tmp/v27.patch
          patch -p1 --batch < /tmp/v27.patch

      - name: Apply v2.8 alpha2 app patch
        shell: bash
        run: |
          set -euo pipefail
          cat dealflash-v28-alpha2/p{00,01,02,03}.b64 > /tmp/v28-app.patch.gz.b64
          base64 -d /tmp/v28-app.patch.gz.b64 > /tmp/v28-app.patch.gz
          echo "887f414db6dbf778acd9669a86e3585e2357eca5416425cb6b821f2204758277  /tmp/v28-app.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v28-app.patch.gz > /tmp/v28-app.patch
          cd dealflash_build_min
          patch -p1 --batch < /tmp/v28-app.patch
          patch -p1 --batch < ../dealflash-v28-alpha2/endpoint-fix.patch
          grep -q "versionName '2.8.0-alpha2'" app/build.gradle
          grep -q "com.google.gms.google-services" app/build.gradle
          grep -q "firebase-messaging" app/build.gradle
          grep -q "class DealFlashMessagingService" app/src/main/java/com/dealflash/app/DealFlashMessagingService.java
          grep -q "class DeviceIdentity" app/src/main/java/com/dealflash/app/DeviceIdentity.java
          grep -q "class PushBootstrap" app/src/main/java/com/dealflash/app/PushBootstrap.java
          grep -q "PushBootstrap.start" app/src/main/java/com/dealflash/app/MainActivity.java
          ! grep -q "지금 가장 강한 딜" app/src/main/java/com/dealflash/app/MainActivity.java
          test -f app/google-services.json
          printf 'android.useAndroidX=true\n' > gradle.properties

      - name: Apply v2.8.1 stability patch
        shell: bash
        run: |
          set -euo pipefail
          cat dealflash-v281-fix/p{00,01,02}.b64 > /tmp/v281.patch.gz.b64
          base64 -d /tmp/v281.patch.gz.b64 > /tmp/v281.patch.gz
          echo "c76a5e0befacb8a433df8852db3d075c5b90be6649bb25a5aa8d02cd86b24d1c  /tmp/v281.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v281.patch.gz > /tmp/v281.patch
          cd dealflash_build_min
          patch -p1 --batch < /tmp/v281.patch
          patch -p1 --batch < ../dealflash-v281-fix/discovery.patch
          grep -q "versionName '2.8.1'" app/build.gradle
          grep -q "syncDiscovery" app/src/main/java/com/dealflash/app/ServerSync.java
          grep -q "bootstrap=after==0" app/src/main/java/com/dealflash/app/ServerSync.java
          grep -q 'if("발견".equals(name))' app/src/main/java/com/dealflash/app/MainActivity.java
          ! grep -q "h.spark" app/src/main/java/com/dealflash/app/MainActivity.java

      - name: Apply v2.8.1 hotfix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d dealflash-v281-hotfix/apply.py.b64 > /tmp/v281.py
          cd dealflash_build_min
          python3 /tmp/v281.py
          grep -q "versionName '2.8.1'" app/build.gradle
          grep -q "알림과 무관한 발견 신호" app/src/main/java/com/dealflash/app/MainActivity.java
          grep -q "drop<threshold" app/src/main/java/com/dealflash/app/DealFlashMessagingService.java
          grep -q "syncEligible" app/src/main/java/com/dealflash/app/HotDealStore.java
          grep -q "/api/deals?signal=" app/src/main/java/com/dealflash/app/ServerSync.java

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Build v2.8.1 APK
        working-directory: dealflash_build_min
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.dealflash.app'" /tmp/badging.txt
          cp "$APK" /tmp/DealFlash-v2.8.1.apk
          sha256sum /tmp/DealFlash-v2.8.1.apk

      - name: Package exact source
        working-directory: dealflash_build_min
        shell: bash
        run: |
          set -euo pipefail
          zip -qr /tmp/DealFlash-v2.8.1-source.zip . \
            -x 'app/build/*' '.gradle/*' 'server-v26/node_modules/*' 'server-v26/dist/*'

      - uses: actions/upload-artifact@v4
        with:
          name: DealFlash-v2.8.1-apk
          path: /tmp/DealFlash-v2.8.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DealFlash-v2.8.1-source
          path: /tmp/DealFlash-v2.8.1-source.zip
