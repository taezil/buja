name: Build DealFlash v1.1 APK
on:
  push:
    branches: [dealflash-v06-build]
  workflow_dispatch:
permissions:
  contents: read
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore v1.1 source
        run: |
          cp dealflash-v11-source.zip v11.zip
          mkdir buildsrc
          cd buildsrc
          unzip -q ../v11.zip
      - name: Build debug APK
        working-directory: buildsrc
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DealFlash-v1.1-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
