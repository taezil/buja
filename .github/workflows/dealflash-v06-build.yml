name: DealFlash v0.6 APK
on:
  push:
    branches: [dealflash-v06-build]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore source
        run: |
          base64 -d repochunks/v06/chunk-00 > /tmp/v06.zip
          rm -rf buildsrc && mkdir buildsrc
          unzip -q /tmp/v06.zip -d buildsrc
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build
        working-directory: buildsrc
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DealFlash-v0.6-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
