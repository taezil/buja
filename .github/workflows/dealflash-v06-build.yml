name: DealFlash v0.6 APK
on:
  push:
    branches: [dealflash-v06-build]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore source zip
        run: |
          base64 -d repochunks/v06/chunk-00 > /tmp/v06.zip
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q /tmp/v06.zip -d buildsrc
      - name: Build
        working-directory: buildsrc
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DealFlash-v0.6-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
