name: Build DealFlash v1.5 APK
on:
  push:
    branches: [dealflash-v06-build]
  workflow_dispatch:
permissions:
  contents: read
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore and patch v1.5 source
        run: |
          mkdir buildsrc
          cd buildsrc
          unzip -q ../dealflash-v12-source.zip
          cp ../v13-overlay/ServerSync.java app/src/main/java/com/dealflash/app/ServerSync.java
          python3 ../v15-patch.py
          grep -RIl 'V1.2' app/src/main | xargs -r sed -i 's/V1\.2/V1.5/g'
          grep -RIl 'v1.2' app/src/main | xargs -r sed -i 's/v1\.2/v1.5/g'
          sed -i "s/versionCode 12/versionCode 15/; s/versionName '1.2.0'/versionName '1.5.0'/" app/build.gradle
      - name: Build debug APK
        working-directory: buildsrc
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DealFlash-v1.5-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
