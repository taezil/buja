name: Build DealFlash v1.7 APK
on:
  push:
    branches: [dealflash-v06-build]
  workflow_dispatch:
permissions:
  contents: read
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore and patch v1.7 source
        run: |
          mkdir buildsrc
          cd buildsrc
          unzip -q ../dealflash-v12-source.zip
          cp ../v13-overlay/ServerSync.java app/src/main/java/com/dealflash/app/ServerSync.java
          python3 ../v15-patch.py
          echo '=== Live Fallcent parser smoke test ==='
          curl -sSL --max-time 15 'https://fallcent.com/product/recommend/?from=gnb' -o /tmp/fallcent.html || true
          python3 - <<'PY'
          import re
          h=open('/tmp/fallcent.html',encoding='utf-8').read()
          anchors=re.findall(r'''(?is)<a[^>]+href=["']([^"']*/product/[^"']+)["'][^>]*>(.*?)</a>''',h)
          ok=[]
          for href,b in anchors:
              t=re.sub(r'<[^>]+>',' ',b)
              t=re.sub(r'\s+',' ',t)
              if not any(x in t for x in ('로켓배송','로켓직구','판매자로켓')) or '판매자배송' in t: continue
              pm=re.search(r'(?:▼|↓)\s*([0-9]{1,2})\s*%',t)
              wm=re.search(r'([0-9][0-9,]{2,})\s*원',t)
              if pm and wm: ok.append((href,wm.group(1),pm.group(1),t[:100]))
          print('FALLCENT_ANCHORS',len(anchors),'APP_COMPATIBLE_PRODUCTS',len(ok))
          for x in ok[:3]: print('SAMPLE',x)
          print('NOTE server-side curl may be blocked; Android uses WebView DOM parser')
          PY
          grep -RIl 'V1.2' app/src/main | xargs -r sed -i 's/V1\.2/V1.7/g'
          grep -RIl 'v1.2' app/src/main | xargs -r sed -i 's/v1\.2/v1.7/g'
          sed -i "s/versionCode 12/versionCode 17/; s/versionName '1.2.0'/versionName '1.7.0'/" app/build.gradle
      - name: Build debug APK
        working-directory: buildsrc
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DealFlash-v1.7-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
